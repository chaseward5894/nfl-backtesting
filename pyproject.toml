[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nflbetting-backtest"
version = "0.1.0"
description = "Backtesting library for the nflbetting rating model"
requires-python = ">=3.11"
dependencies = [
    "nflbetting @ file:///home/jailop/devel/chase/NFL-Model-UPDATED",
    "polars",
    "pandas",
    "scipy",
    "openpyxl",
    "requests",
    "pyyaml",
    "nflreadpy",
]

[project.scripts]
nflbt-run = "nflbetting_backtest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
nflbetting_backtest = ["../../data/**/*.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]